[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-drug-shortage-db"
version = "0.2.0"
description = "Iranian drug-shortage monitoring, Telegram bot, and admin dashboard"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "Django>=5.1,<6",
  "dj-database-url>=2.2",
  "psycopg[binary]>=3.2",
  "gunicorn>=23.0",
  "whitenoise>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iran-shortages = "iran_shortages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
